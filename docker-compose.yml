services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: desafio_livros_app
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: desafio_livros_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: livros
      MYSQL_USER: livros_user
      MYSQL_ROOT_PASSWORD: livros_senha
      MYSQL_PASSWORD: livros_senha
    ports:
      - "5434:3306"
    volumes:
      - db-data:/var/lib/mysql

  nginx:
    image: nginx:alpine
    container_name: desafio_livros_nginx
    ports:
      - "8000:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  db-data:



